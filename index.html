<html>
<head>
    <title>CSC3210 Galactic Glide</title>
</head>
<body>
    
  <!-- Three.js Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script type="module">

// Initialize the Scene
const scene = new THREE.Scene();

//Camera Projections
const camera = new THREE.PerspectiveCamera(
  35, 
  window.innerWidth / window.innerHeight, 
  0.1, 
  1000
);
camera.position.set(0, 0, 300); // Position the camera along the +Z axis
camera.lookAt(new THREE.Vector3(0, 0, 0)); //x,y,z
scene.add(camera);

const rearViewCamera = new THREE.PerspectiveCamera(
  35, 
  window.innerWidth / window.innerHeight, 
  0.1, 
  1000
);
rearViewCamera.position.set(0, 0, -300); // Position the rear view camera along the -Z axis
rearViewCamera.lookAt(new THREE.Vector3(0, 0, 0)); //x,y,z
scene.add(rearViewCamera);

const backgroundLoader = new THREE.TextureLoader();
const spaceTexture = backgroundLoader.load('HuGGeENt6kGyixe3hT9tnY.jpg');
spaceTexture.colorSpace = THREE.SRGBColorSpace;
scene.background = spaceTexture;

const asteroidMeshes = [];
const starMeshes = [];

const numOfAsteroids = 100; //controls the number of asteroids rendered
const numOfStars = 100; //controls the number of stars rendered

const clock = new THREE.Clock();
let animationId;

var driftType = 0;
var baseScale = 0;
var growShrinkVariance = 0;
var scaleSpeed = 0;
var waveSpeed = 0;
var waveFrequency = 0;
var waveAmplitude = 0;

const browserHeight = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov/2)) * camera.position.z;
const browserWidth = browserHeight * camera.aspect;
const browserLeftEdge = -browserWidth / 2;
const browserRightEdge = browserWidth /2;


const vertexShader  = `
float random(vec3 p){
return fract(sin(dot(p, vec3(10, 40, 10))) * 43758.5453123);}

uniform float uTime;
uniform float uScale;

varying vec3 vNormal;
varying vec3 vPosition;
varying vec2 vUv;


    void main() {

        vNormal = normal;
        vUv = uv;

        float noise = random(position + uTime * 0.1);

        vec3 newPosition = position + normal * noise * uScale;

        vPosition = newPosition;

        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
    }
`; 

const fragmentShader = `
uniform sampler2D uTexture;
varying vec2 vUv;


  void main() {
    gl_FragColor = texture2D(uTexture, vUv);
  }
`;

const auraFragmentShader = `
uniform sampler2D uTexture;
uniform float uOpacity;
varying vec2 vUv;


  void main() {
    vec4 textureColor = texture2D(uTexture, vUv);
    gl_FragColor = vec4(textureColor.rgb, textureColor.a * uOpacity);
  }
`;

const asteroidFragmentShader = `
uniform sampler2D uTexture;
varying vec2 vUv;

void main() {
    gl_FragColor = texture2D(uTexture, vUv);
}
`;
const listener = new THREE.AudioListener();
camera.add(listener);
const collision = new THREE.Audio(listener);
const audioLoader = new THREE.AudioLoader();
audioLoader.load('collision.mp3', function(buffer) {
    collision.setBuffer(buffer);
});

let ship = null;
const shipBox = new THREE.Box3();
const loader = new THREE.GLTFLoader();
loader.load(
    'sci-fi_personal_space_pod_shipweekly_challenge/scene.gltf',
    function (gltf) {
        ship = gltf.scene;

        shipBox.setFromObject(ship);
        const size = shipBox.getSize(new THREE.Vector3());
        const center = shipBox.getCenter(new THREE.Vector3());
        ship.rotation.y = THREE.MathUtils.degToRad(-90);
        // Center the model around its own origin
        ship.position.sub(center);

        // Scale its largest dimension to 40 units
        const largestDimension = Math.max(size.x, size.y, size.z);
        if (largestDimension > 0) {
            ship.scale.setScalar(40 / largestDimension);
        }

        // Put it in front of the camera
        ship.position.set(0, 0, 300);

        scene.add(ship);

        console.log("Ship added to scene:", ship);
    },
    undefined,
    function (error) {
        console.error("Ship loading failed:", error);
    }
);

// Ambient light illuminates the entire ship
const ambientLight = new THREE.AmbientLight(0xffffff, 2);
scene.add(ambientLight);

//speed
let speed = 0.0;
let speedUp = false;
let direction = new THREE.Vector3(0, 0, 0);
camera.getWorldDirection(direction);

let wPressed = false;
let sPressed = false;

document.addEventListener("keydown", function(event) {
    if(event.key === "w") {
        wPressed = true;
    }
    if(event.key === "s") {
        sPressed = true;
    }
    if(event.key === "Shift") {
        speedUp = true;
    }
});
document.addEventListener("keyup", function(event) {
    if(event.key === "w") {
        wPressed = false;
    }
    if(event.key === "s") {
        sPressed = false;
    }
    if(event.key === "Shift") {
        speedUp = false;
    }
});

//Camera Rotation
let isMouseDown = false;
let mouseSensitivity = 0.005;
let horizontalRotation = 0;   // Rotation left and right
let VerticalRotation = 0; // Rotation up and down
const maxPitch = Math.PI / 2 - 0.01;
document.addEventListener("mousemove", function(event) { // Rotates the camera based on mouse movement while pointer lock is active
    if (document.pointerLockElement === renderer.domElement) {
        horizontalRotation -= event.movementX * mouseSensitivity;
        VerticalRotation -= event.movementY * mouseSensitivity;

        VerticalRotation = Math.max(-maxPitch,Math.min(maxPitch, VerticalRotation));
        camera.rotation.order = "YXZ";
        camera.rotation.y = horizontalRotation;
        camera.rotation.x = VerticalRotation;
    }
});

function randomPoint(){
    const maxRadius = 800;
    const randomRadius = Math.random() * maxRadius + 100;
    const z = Math.random() * 2 - 1;
    const angle = Math.random() * Math.PI * 2;
    const distance = Math.sqrt(1 - z * z);
    const randomVec = new THREE.Vector3(
        distance * Math.cos(angle),
        distance * Math.sin(angle),
        z
    );
    randomVec.multiplyScalar(randomRadius);
    return randomVec;
}

function placeObject(object){
    const distance = Math.random() * 400 + 500;
    const halfHeight = distance * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))
    const halfWidth = halfHeight * camera.aspect;
    const localPos = new THREE.Vector3((Math.random() * 2 - 1) * halfWidth, (Math.random() * 2 - 1) * halfWidth, -distance);
    object.position.copy(localPos.applyQuaternion(camera.quaternion).add(camera.position));
    object.userData.startY = object.position.y;
    object.userData.startX = object.position.x;
    object.userData.startZ = object.position.z;
}

function shouldReset(object){
    const offset = object.position.clone().sub(camera.position);
    return offset.lengthSq() > 600 * 600;
//     return object.position.z > camera.position.z + 100
}

/*
  * I used ChatGPT to help debug my asteroid creation logic.
  * With each prompt I entered my current code so ChatGPT could see my progress.
  * I used the following prompts: 
  * "Why does it keep saying that asteroidMesh is not defined at animateAsteroids when it is:", "Why will my code for the asteroid not work, if I go the width of the browser then the asteroid should restart at the other end:",
  * "It still  just never restarts:", and "Why do the asteroids sometimes render off screen:".
  */
// Creates and textures asteroids, placing them at random positions along the Z-axis
function createAsteroids(){
var textureLoader = new THREE . TextureLoader () ;

for(let i = 0; i < numOfAsteroids; i++){

const asteroidGeometry = new THREE.SphereGeometry(5, 9, 9);
textureLoader.load("istockphoto-1390352280-612x612.jpg", function (texture) {
    const asteroidMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: Math.random() * 1000 },
            uScale: { value: 4.0 },
            uTexture: { value: texture }
            // I used this stackoverflow page to learn how to put a texture into a shaderMaterial: https://stackoverflow.com/questions/45442535/three-js-shadermaterial-add-texture-to-particles

        },
        vertexShader: vertexShader,
        fragmentShader: asteroidFragmentShader,
        side: THREE.DoubleSide
    });
    const asteroid = new THREE.Mesh(asteroidGeometry, asteroidMaterial);

const asteroidScale = 1.0 + (Math.random() * 2 - 1) * 0.8;
asteroid.scale.setScalar(asteroidScale);

placeObject(asteroid);

asteroid.userData.driftType = i % 4;
asteroid.userData.driftSpeed = 0.2 + Math.random() * 0.3;
asteroid.userData.curveAmt = Math.random() * 0.0001;

asteroid.userData.waveSpeed = 0.2 + Math.random() * 0.2;
asteroid.userData.waveAmplitude = 5 + Math.random() * 10;
asteroid.userData.waveFrequency = 0.01 + Math.random() * 0.02;

asteroid.userData.boundingBox = new THREE.Box3().setFromObject(asteroid);

asteroidMeshes[i] = asteroid;
scene.add(asteroid);
}, undefined, function (err) {
    console.error("texture not loaded", err);
});
}
}

// Creates and textures stars, placing them at random positions along the Z-axis
function createStars(){
var textureLoader = new THREE . TextureLoader () ;

for(let i = 0; i < numOfStars; i++){
const starGeometry = new THREE.SphereGeometry(4, 8, 9);
const starAuraGeometry = new THREE.SphereGeometry(9, 8, 9);

textureLoader.load("startex2.jpg", function (texture) {
    const starMaterial = new THREE.ShaderMaterial({
    uniforms: {
        uTime: { value: 0 },
        uScale: { value: 3.0 },
        uTexture: { value: texture },
    },
    vertexShader: vertexShader,
    fragmentShader: fragmentShader,
    side: THREE.DoubleSide
});

const starAuraMaterial = new THREE.ShaderMaterial({
    uniforms: {
        uTime: { value: 0 },
        uScale: { value: 3.0 },
        uTexture: { value: texture },
        uOpacity: { value: 0.4 }
    },
    vertexShader: vertexShader,
    fragmentShader: auraFragmentShader,
    side: THREE.BackSide,
    transparent:true
});


    starMeshes.push(new THREE.Mesh(starGeometry, starMaterial));
    const auraMesh = new THREE.Mesh(starAuraGeometry,starAuraMaterial);
    starMeshes[i].add(auraMesh);
    starMeshes[i].position.copy(randomPoint());
    starMeshes[i].userData.startY = starMeshes[i].position.y;
    starMeshes[i].userData.boundingBox = new THREE.Box3().setFromObject(starMeshes[i]);
    scene.add(starMeshes[i]);

}, undefined, function (err) {
    console.error("texture not loaded", err);
});
}
}

// 4. Initialize the WebGL Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setClearColor(0x111111, 1.0); // Dark grey background
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setViewport(0,0,window.innerWidth,window.innerHeight);
renderer.setScissor(0,0,window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);
renderer.domElement.addEventListener("click", function() {
    renderer.domElement.requestPointerLock();
});
renderer.render(scene, camera);

//This function allows for the rear view mirror to be subject to the scissor test and placed in the top right corner of the camera
function renderViews() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    const viewSize = 250;
    const margin = 20;

    renderer.setScissorTest(true);

    //Main camera
    renderer.setViewport(0, 0, width, height);
    renderer.setScissor(0, 0, width, height);
    renderer.render(scene, camera);

    //Secondary camera
    const x = width - viewSize - margin;
    const y = height - viewSize - margin;

    renderer.setViewport(x, y, viewSize, viewSize);
    renderer.setScissor(x, y, viewSize, viewSize);
    renderer.render(scene, rearViewCamera);

    renderer.setScissorTest(false);
}

 /*
  * I used ChatGPT to help debug my asteroid animation logic.
  * With each prompt I entered my current code so ChatGPT could see my progress.
  * I used the following prompts: 
  * "I tried to make them grow/ shrink based on their position on the sin wave, but I think I made the frequency of the sine wave too low:", "Why don't the asteroids move along these functions that I assigned to their y positions:",
  * "Ok. I want to figure out the problem on my own, but why are the asteroids rapidly coming now, I think it has to do with my reset in the animate function:",
  * "Ok. So, its moving very slowly now, what did I mess up:", "Ok. So, what should I fix, I was trying to make everything unique", "Why are all the asteroids flat disks now:", "Ok, but they still grow and shrink rapidly:",
  * "I tried this, just taking a step back from scaling and I realized they are all currently moving linearly:", "Ok. So, I am pretty sure they are random functions at this point and are unique, but they move pretty fast:",
  * "Ok. Here is what I have, the asteroids don't dynamically grow though:", and "Ok, but now it doesn't even seem like the asteroids are moving:".
  */
//This function animates asteroids according to various drift functions across the z-axis and allows the asteroids to grow and shrink over time
function animateAsteroids(deltaTime, elapsedTime) {
    for (let i = 0; i < asteroidMeshes.length; i++) {
        const timeSinceStart = elapsedTime;
        const asteroid = asteroidMeshes[i];

        if (asteroid) {
         // How far the asteroid has moved along Z
        const distance = asteroid.position.z - asteroid.userData.startZ;

        asteroid.rotation.x += 0.6 * deltaTime;
        asteroid.rotation.y += 0.6 * deltaTime;

        asteroid.position.z += 60 * deltaTime;

        switch (asteroid.userData.driftType) {
            case 0: // Sinusoidal movement
                asteroid.position.y = asteroid.userData.startY +
                    Math.sin(timeSinceStart * asteroid.userData.waveSpeed + distance * asteroid.userData.waveFrequency) * asteroid.userData.waveAmplitude;
                    break;

                case 1: // Linear movement
                    asteroid.position.y = asteroid.userData.startY + distance * asteroid.userData.driftSpeed;
                    break;

                case 2: // Parabolic movement
                    asteroid.position.y = asteroid.userData.startY +
                        asteroid.userData.curveAmt * distance * distance;
                    break;

                case 3: // Cubic movement
                    asteroid.position.y = asteroid.userData.startY +
                        asteroid.userData.curveAmt * Math.pow(distance, 3) * 0.01;
                    break;
            }


        if(shouldReset(asteroid)){
           placeObject(asteroid);
       }
       
       /*
  * I used ChatGPT to help debug my asteroid collision logic.
  * With each prompt I entered my current code so ChatGPT could see my progress.
  * I used the following prompts: 
  * "Why won't my test cube show up:" and "Why does my collision logic not work, it should work currently if the top/botom/front/back are hit by any of the asteroids:".
  */
       if (asteroid.userData.boundingBox) {
            asteroid.userData.boundingBox.setFromObject(asteroid);
            const isColliding = asteroid.userData.boundingBox.intersectsBox(shipBox);
            if (isColliding && !asteroidMeshes[i].userData.isColliding) { //When an asteroid collides with the ship, reset its position randomly
            placeObject(asteroid);
                damage();
            screenShake();
                scene.remove(asteroidMeshes[i]);
            }
            asteroidMeshes[i].userData.isColliding = isColliding;
        }
    }
        }


    const baseScale = 1.0;
    const growShrinkVariance = 0.25;
        for(let i = 0; i < starMeshes.length; i++){
            const timeSinceStart = elapsedTime;
            if(starMeshes[i]){
                const starMovementAlgo = Math.sin(timeSinceStart * waveSpeed + starMeshes[i].position.x * waveFrequency ) * waveAmplitude; //Controls the movement of the stars
                const currSinVal = Math.sin(timeSinceStart * waveSpeed + starMeshes[i].position.x * waveFrequency );
                const currCosineVal = Math.cos(timeSinceStart * waveSpeed + starMeshes[i].position.x * waveFrequency );

        starMeshes[i].rotation.x += 0.6 * deltaTime;
        starMeshes[i].rotation.y += 0.6 * deltaTime;
        starMeshes[i].position.z += 60 * deltaTime;

    starMeshes[i].position.y = starMeshes[i].userData.startY + Math.sin(timeSinceStart * waveSpeed + starMeshes[i].position.x * waveFrequency) * waveAmplitude;
        
    if(i % 2 == 0){ //This allows the star mesh to grow and shrink based on the current index of the for loop and the current value of a sine function
        starMeshes[i].scale.set(baseScale + (currSinVal * growShrinkVariance),baseScale + (currSinVal * growShrinkVariance),baseScale + (currSinVal * growShrinkVariance));
    }else{
        starMeshes[i].scale.set(baseScale + (currCosineVal * growShrinkVariance),baseScale + (currCosineVal * growShrinkVariance),baseScale + (currCosineVal * growShrinkVariance));
    }

       if(shouldReset(starMeshes[i])){
           placeObject(starMeshes[i]);
       }
        if (starMeshes[i].userData.boundingBox) {
            starMeshes[i].userData.boundingBox.setFromObject(starMeshes[i]);
            const isColliding = starMeshes[i].userData.boundingBox.intersectsBox(shipBox);
            if (isColliding && !starMeshes[i].userData.isColliding) {
                heal();
                screenShake();
                scene.remove(starMeshes[i]);
            }
            starMeshes[i].userData.isColliding = isColliding;
        }
    }
        }
}

let shakeAmount = 0;
const shakeDecay = 0.9; //time screen shakes for

//This function moves the screen up and down to simulate a collision when an asteroid or star collides with the ship
function screenShake() {
    shakeAmount = 2.0;
    collision.play();
}

//health bar ui element
const healthBar = new THREE.Group();

const barBackground = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 0.2),
    new THREE.MeshBasicMaterial({
        color: 0xff0000,
        depthTest: false
    })
);

const barFill = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 0.2),
    new THREE.MeshBasicMaterial({
        color: 0x00ff00,
        depthTest: false
    })
);
healthBar.add(barBackground);
healthBar.add(barFill);
barBackground.renderOrder = 999;
barFill.renderOrder = 1000;
camera.add(healthBar);

function damage() {
    if (barFill.scale.x > 0.0) {
        barFill.scale.x = Math.max(0, barFill.scale.x - 0.1);
        barFill.position.x -= 0.1;
    } 
    if (barFill.scale.x === 0.0) {
        cancelAnimationFrame(animationId);
    }
}
function heal() {
    if (barFill.scale.x < 1.0) {
        barFill.scale.x += 0.1;
        barFill.position.x += 0.1;
    }
}


//This function allows the user to control the spaceship's speed when in first person mode by using the keys 'w' and 's'
function animateSpaceship(deltaTime) {
    if (!ship) return;
    camera.getWorldDirection(direction);
    if(wPressed === true) {
        if(speed < 120.0) { //maximum forward speed
            if (speedUp === true) {
                speed += 36.0 * deltaTime;
            } else {
                speed += 12.0 * deltaTime;
            }
        }
    }
    
    if(sPressed === true) {
        if(speed > -120.0) { //maximum backward speed
            speed -= 12.0 * deltaTime;
            speed = Math.max(-120.0, speed);
        }
    }
    if(speed < 0.0 && sPressed === false) {
        speed = Math.min(0, speed + 12.0 * deltaTime);
    }
    if(speed > 0.0 && wPressed === false) {
        speed = Math.max(0, speed - 12.0 * deltaTime);
    }
    ship.rotation.copy(camera.rotation);
    ship.rotateY(THREE.MathUtils.degToRad(-90));
    ship.position.addScaledVector(direction, speed * deltaTime);
    camera.position.copy(ship.position);
    if (shakeAmount > 0.01) {
        camera.position.x += (Math.random() - 0.5) * shakeAmount;
        camera.position.y += (Math.random() - 0.5) * shakeAmount;
        camera.position.z += (Math.random() - 0.5) * shakeAmount;
        shakeAmount *= Math.pow(shakeDecay, deltaTime * 60);
    } else {
        shakeAmount = 0;
    }
    rearViewCamera.position.copy(camera.position);
    rearViewCamera.rotation.copy(camera.rotation);
    healthBar.position.set(-3.5,-2.5,-10);
    rearViewCamera.rotateY(Math.PI);
    shipBox.setFromObject(ship);
}
createAsteroids();
createStars();

function animate() {
    animationId = requestAnimationFrame(animate);
    const deltaTime = Math.min(clock.getDelta(), 0.1); // Gets the elapsed time since the clock was last updated
    const elapsedTime = clock.getElapsedTime(); // Gets the total elapsed time since the clock was started

    animateSpaceship(deltaTime);
    animateAsteroids(deltaTime, elapsedTime);
    renderViews();
}
animate();
    </script>
