<html>
<head>
    <title>CSC3210 Galactic Glide</title>
</head>
<body>
    
  <!-- Three.js Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script type="module">

// 1. Initialize the Scene
const scene = new THREE.Scene();

// 2. Configure the Camera (Perspective Projection)
// Arguments: Field of View (deg), Aspect Ratio, Near Clipping Plane, Far Clipping Plane
const camera = new THREE.PerspectiveCamera(
  35, 
  window.innerWidth / window.innerHeight, 
  0.1, 
  1000
);
camera.position.set(0, 0, 300); 
camera.lookAt(new THREE.Vector3(0, 0, 0));
scene.add(camera);

const backgroundLoader = new THREE.TextureLoader();
const spaceTexture = backgroundLoader.load('HuGGeENt6kGyixe3hT9tnY.jpg');
spaceTexture.colorSpace = THREE.SRGBColorSpace;
scene.background = spaceTexture;

const asteroidMeshes = [];
const numOfAsteroids = 10; //controls the number of asteroids rendered

const clock = new THREE.Clock();
const waveSpeed = 0.5;
const waveFrequency = 0.1;
const waveAmplitude = 2.0;
var driftType = 0;
const browserHeight = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov/2)) * camera.position.z;
const browserWidth = browserHeight * camera.aspect;
const browserLeftEdge = -browserWidth / 2;
const browserRightEdge = browserWidth /2;

function createAsteroids(){
var textureLoader = new THREE . TextureLoader () ;

for(let i = 0; i < numOfAsteroids; i++){
const asteroidGeometry = new THREE.SphereGeometry(5, 9, 9);
textureLoader.load("istockphoto-1390352280-612x612.jpg", function (texture) {
    var material = new THREE.MeshBasicMaterial({ map: texture });
    asteroidMeshes.push(new THREE.Mesh(asteroidGeometry, material));
    asteroidMeshes[i].position.x = (Math.random() -0.5) * 100; // Don't want overlap
    asteroidMeshes[i].position.y = (Math.random() -0.5) * 60;
    asteroidMeshes[i].position.z = (Math.random() -0.5) * 400;
    asteroidMeshes[i].userData.startY = asteroidMeshes[i].position.y;
    asteroidMeshes[i].userData.startX = asteroidMeshes[i].position.x;
    asteroidMeshes[i].userData.startZ = asteroidMeshes[i].position.z;
    scene.add(asteroidMeshes[i]);
    animateAsteroids();
}, undefined, function (err) {
    console.error("texture not loaded", err);
});
}
}

createAsteroids();

// 4. Initialize the WebGL Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setClearColor(0x111111, 1.0); // Dark grey background
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const newCube = new Float32Array([
        5, 5, 5, //Top point one (bottom left on top side)
        5, 5, -5, //Top point two (top left on top side)
        -5, 5, 5, //Top point three (bottom right on top side)
        -5, 5, -5,//Top point four (top right on top side)
        5, -5, -5,//Bottom point one (top left on bottom side)
        5, -5, 5,//Bottom point two (bottom left on bottom side)
        -5, -5, 5,//Bottom point three (bottom right on bottom side)
        -5, -5, -5 //Bottom point four (top right on bottom side)
        ]);

        const indices = [
            // Top face
            0, 1, 2,   2, 1, 3,
            // Bottom face
            4, 5, 7,   7, 5, 6,
            // Front face
            5, 0, 6,   6, 0, 2,
            // Back face
            1, 4, 3,   3, 4, 7,
            // Right face (Positive X)
            0, 5, 1,   1, 5, 4,
            // Left face (Negative X)
            6, 2, 7,   7, 2, 3
        ];

        const cubeGeometry = new THREE.BufferGeometry();
        cubeGeometry.setIndex(indices);
        cubeGeometry.setAttribute('position', new THREE.BufferAttribute(newCube, 3));

        const cubeMaterial = new THREE.MeshBasicMaterial({
            color: 0xff0000,
            wireframe: false,
            side: THREE.DoubleSide
        });

        const cubeMesh = new THREE.Mesh(cubeGeometry, cubeMaterial);
        cubeMesh.position.y = 0;
        cubeMesh.position. x = 0;
        // scene.add(cubeMesh);

        const collisionAnimation = new THREE.AnimationMixer(cubeMesh);
        function handleShipCollision(hitBoxA, hitBoxB){
            if (hitBoxA.intersectsBox(hitBoxB)){
                console.log("Collision Detected");

            const collsionDurations = [0,0.1,0.1,0.4];
            const collisionMovements = [cubeMesh.position.y, cubeMesh.position.y + 10, cubeMesh.position.y - 10, cubeMesh.position.y];

            const collisionTrack = new THREE.NumberKeyframeTrack('.position[y]', collsionDurations, collisionMovements);
            const collisionClip = new THREE.AnimationClip('CollisionDetected', 0.4, [collisionTrack]);

            const asteroidCollision = collisionAnimation.clipAction(collisionClip);
            
            if(!asteroidCollision.isRunning()){
            asteroidCollision.reset(); //Don't want 2 copies running
            asteroidCollision.setLoop(THREE.LoopOnce, 1);
            asteroidCollision.clampWhenFinished = true;
            asteroidCollision.play();
            }
            }
        }

function animateAsteroids() {
    const deltaTime = clock.getDelta();
    const baseScale = 1.0;
    const growShrinkVariance = 0.5;
        for(let i = 0; i < asteroidMeshes.length; i++){
            driftType = i % 4;
            const shipHitbox = new THREE.Box3().setFromObject(cubeMesh);
            const asteroidHitbox = new THREE.Box3().setFromObject(asteroidMeshes[i]);
            const timeSinceStart = clock.getElapsedTime();
            if(asteroidMeshes[i]){
                const asteroidMovementAlgo = Math.sin(timeSinceStart * waveSpeed + asteroidMeshes[i].position.x * waveFrequency ) * waveAmplitude; //Controls the movement of the asteroids
                const currSinVal = Math.sin(timeSinceStart * waveSpeed + asteroidMeshes[i].position.x * waveFrequency );
                const currCosineVal = Math.cos(timeSinceStart * waveSpeed + asteroidMeshes[i].position.x * waveFrequency );

        asteroidMeshes[i].rotation.x += 0.01;
        asteroidMeshes[i].rotation.y += 0.01;
       asteroidMeshes[i].position.z += 0.05;

       //Logic for if the ship is hit from the front, back, top, or bottom
        handleShipCollision(shipHitbox, asteroidHitbox);
       var x = asteroidMeshes[i].position.x;
        
         switch(driftType){
            case 0: //3 of 10 asteroids will drift according to some sinusoidal function
            asteroidMeshes[i].position.y = asteroidMeshes[i].userData.startY + Math.sin(timeSinceStart * waveSpeed + x * waveFrequency) * waveAmplitude;
                break;
            case 1: //3 of 10 asteroids will drift along some linear function
            asteroidMeshes[i].position.y = asteroidMeshes[i].userData.startY + (timeSinceStart * 2) - 100;
                break;
            case 2: //2 of 10 asteroids will drift along some parabolic function
            asteroidMeshes[i].position.y = asteroidMeshes[i].userData.startY + (0.001 * x * x) - 50;
                break;
            case 3: //2 of 10 asteroids will drift along some irregular function (cubic plus logarithmic)
            asteroidMeshes[i].position.y = asteroidMeshes[i].userData.startY + (0.001 * Math.pow(x, 3)) + (0.5 * Math.log(Math.abs(x))) - 200;
                break;
            default: //If any additional asteroids, they will drift along some cosinusoidal function 
            asteroidMeshes[i].position.y = asteroidMeshes[i].userData.startY + Math.cos(timeSinceStart * waveSpeed + x * waveFrequency) * waveAmplitude; 
         }
    if(i % 2 == 0){
        asteroidMeshes[i].scale.set(baseScale + (currSinVal * growShrinkVariance),baseScale + (currSinVal * growShrinkVariance),baseScale + (currSinVal * growShrinkVariance));
    }else{
        asteroidMeshes[i].scale.set(baseScale + (currCosineVal * growShrinkVariance),baseScale + (currCosineVal * growShrinkVariance),baseScale + (currCosineVal * growShrinkVariance));
    }

        if(asteroidMeshes[i].position.z >= 600){
            asteroidMeshes[i].position.x = (Math.random() -0.5) * 100; // Don't want overlap
            asteroidMeshes[i].position.y = (Math.random() -0.5) * 60;
            asteroidMeshes[i].position.z = (Math.random() -0.5) * 400;

            asteroidMeshes[i].userData.startY = asteroidMeshes[i].position.y;
            asteroidMeshes[i].userData.startX = asteroidMeshes[i].position.x;
            asteroidMeshes[i].userData.startZ = asteroidMeshes[i].position.z;

        }
    }
}
    
    if (collisionAnimation) {
        collisionAnimation.update(deltaTime);
    }

    renderer.render(scene, camera);

    requestAnimationFrame(animateAsteroids);
}

    </script>
</body>
</html>
