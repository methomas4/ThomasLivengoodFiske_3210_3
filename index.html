<html>
<head>
    <title>CSC3210 Galactic Glide</title>
</head>
<body>
    
  <!-- Three.js Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script type="module">

// 1. Initialize the Scene
const scene = new THREE.Scene();

//Camera Projections
const camera = new THREE.PerspectiveCamera(
  35, 
  window.innerWidth / window.innerHeight, 
  0.1, 
  1000
);
camera.position.set(0, 0, 300); // Position the camera along the +Z axis
camera.lookAt(new THREE.Vector3(0, 0, 0)); //x,y,z
scene.add(camera);

const rearViewCamera = new THREE.PerspectiveCamera(
  35, 
  window.innerWidth / window.innerHeight, 
  0.1, 
  1000
);
rearViewCamera.position.set(0, 0, -300); // Position the rear view camera along the -Z axis
rearViewCamera.lookAt(new THREE.Vector3(0, 0, 0)); //x,y,z
scene.add(rearViewCamera);

const backgroundLoader = new THREE.TextureLoader();
const spaceTexture = backgroundLoader.load('HuGGeENt6kGyixe3hT9tnY.jpg');
spaceTexture.colorSpace = THREE.SRGBColorSpace;
scene.background = spaceTexture;

const asteroidMeshes = [];
const starMeshes = [];

const numOfAsteroids = 10; //controls the number of asteroids rendered
const numOfStars = 10; //controls the number of stars rendered
const clock = new THREE.Clock();
const waveSpeed = 0.5;
const waveFrequency = 0.1;
const waveAmplitude = 2.0;

const browserHeight = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov/2)) * camera.position.z;
const browserWidth = browserHeight * camera.aspect;
const browserLeftEdge = -browserWidth / 2;
const browserRightEdge = browserWidth /2;


const vertexShader  = `
float random(vec3 p){
return fract(sin(dot(p, vec3(10, 40, 10))) * 43758.5453123);}

uniform float uTime;
uniform float uScale;

varying vec3 vNormal;
varying vec3 vPosition;
varying vec2 vUv;


    void main() {

        vNormal = normal;
        vUv = uv;

        float noise = random(position + uTime * 0.1);

        vec3 newPosition = position + normal * noise * uScale;

        vPosition = newPosition;

        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
    }
`; 

const fragmentShader = `
uniform sampler2D uTexture;
varying vec2 vUv;


  void main() {
    gl_FragColor = texture2D(uTexture, vUv);
  }
`;

const auraFragmentShader = `
uniform sampler2D uTexture;
uniform float uOpacity;
varying vec2 vUv;


  void main() {
    vec4 textureColor = texture2D(uTexture, vUv);
    gl_FragColor = vec4(textureColor.rgb, textureColor.a * uOpacity);
  }
`;

const asteroidFragmentShader = `
uniform sampler2D uTexture;
varying vec2 vUv;

void main() {
    gl_FragColor = texture2D(uTexture, vUv);
}
`;
const listener = new THREE.AudioListener();
camera.add(listener);
const collision = new THREE.Audio(listener);
const audioLoader = new THREE.AudioLoader();
audioLoader.load('collision.mp3', function(buffer) {
    collision.setBuffer(buffer);
});

let ship = null;
const shipBox = new THREE.Box3();
const loader = new THREE.GLTFLoader();
loader.load(
    'sci-fi_personal_space_pod_shipweekly_challenge/scene.gltf',
    function (gltf) {
        ship = gltf.scene;

        shipBox.setFromObject(ship);
        const size = shipBox.getSize(new THREE.Vector3());
        const center = shipBox.getCenter(new THREE.Vector3());
        ship.rotation.y = THREE.MathUtils.degToRad(-90);

        console.log("Original ship size:", size);
        console.log("Original ship center:", center);

        // Center the model around its own origin
        ship.position.sub(center);

        // Scale its largest dimension to 40 units
        const largestDimension = Math.max(size.x, size.y, size.z);
        if (largestDimension > 0) {
            ship.scale.setScalar(40 / largestDimension);
        }

        // Put it in front of the camera
        ship.position.set(0, 0, 300);

        scene.add(ship);

        console.log("Ship added to scene:", ship);
    },
    undefined,
    function (error) {
        console.error("Ship loading failed:", error);
    }
);

// Ambient light illuminates the entire ship
const ambientLight = new THREE.AmbientLight(0xffffff, 2);
scene.add(ambientLight);

//speed
let speed = 0.0;
let speedUp = false;
let direction = new THREE.Vector3(0, 0, 0);
camera.getWorldDirection(direction);

let wPressed = false;
let sPressed = false;

document.addEventListener("keydown", function(event) {
    if(event.key === "w") {
        wPressed = true;
    }
    if(event.key === "s") {
        sPressed = true;
    }
    if(event.key === "Shift") {
        speedUp = true;
    }
});
document.addEventListener("keyup", function(event) {
    if(event.key === "w") {
        wPressed = false;
    }
    if(event.key === "s") {
        sPressed = false;
    }
    if(event.key === "Shift") {
        speedUp = false;
    }
});

//Camera Rotation
let isMouseDown = false;
let mouseSensitivity = 0.005;
let horizontalRotation = 0;   // Rotation left and right
let VerticalRotation = 0; // Rotation up and down
const maxPitch = Math.PI / 2 - 0.01;
document.addEventListener("mousemove", function(event) {
    if (document.pointerLockElement === renderer.domElement) {
        horizontalRotation -= event.movementX * mouseSensitivity;
        VerticalRotation -= event.movementY * mouseSensitivity;

        VerticalRotation = Math.max(-maxPitch,Math.min(maxPitch, VerticalRotation));
        camera.rotation.order = "YXZ";
        camera.rotation.y = horizontalRotation;
        camera.rotation.x = VerticalRotation;
    }
});



function createAsteroids(){
var textureLoader = new THREE . TextureLoader () ;

for(let i = 0; i < numOfAsteroids; i++){

    
const asteroidGeometry = new THREE.SphereGeometry(5, 9, 9);
textureLoader.load("istockphoto-1390352280-612x612.jpg", function (texture) {
    const asteroidMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: Math.random() * 1000 },
            uScale: { value: 4.0 },
            uTexture: { value: texture }
            // I used this stackoverflow page to learn how to put a texture into a shaderMaterial: https://stackoverflow.com/questions/45442535/three-js-shadermaterial-add-texture-to-particles

        },
        vertexShader: vertexShader,
        fragmentShader: asteroidFragmentShader,
        side: THREE.DoubleSide
    });
    const asteroid = new THREE.Mesh(asteroidGeometry, asteroidMaterial);
    asteroidMeshes.push(asteroid);
    const asteroidScale = 1.0 + (Math.random() * 2 - 1) * 0.8;
    asteroidMeshes[i].scale.setScalar(asteroidScale);
    asteroidMeshes[i].position.x = (Math.random() * browserWidth) + browserLeftEdge; // Don't want overlap
    asteroidMeshes[i].position.y = (Math.random() * browserHeight) + browserLeftEdge;
    asteroidMeshes[i].userData.startY = asteroidMeshes[i].position.y;
    asteroidMeshes[i].userData.boundingBox = new THREE.Box3().setFromObject(asteroidMeshes[i]);
    scene.add(asteroidMeshes[i]);
}, undefined, function (err) {
    console.error("texture not loaded", err);
});
}
}

function createStars(){
var textureLoader = new THREE . TextureLoader () ;

for(let i = 0; i < numOfStars; i++){
const starGeometry = new THREE.SphereGeometry(4, 8, 9);
const starAuraGeometry = new THREE.SphereGeometry(9, 8, 9);

textureLoader.load("startex2.jpg", function (texture) {
    const starMaterial = new THREE.ShaderMaterial({
    uniforms: {
        uTime: { value: 0 },
        uScale: { value: 3.0 },
        uTexture: { value: texture },
    },
    vertexShader: vertexShader,
    fragmentShader: fragmentShader,
    side: THREE.DoubleSide
});

const starAuraMaterial = new THREE.ShaderMaterial({
    uniforms: {
        uTime: { value: 0 },
        uScale: { value: 3.0 },
        uTexture: { value: texture },
        uOpacity: { value: 0.4 }
    },
    vertexShader: vertexShader,
    fragmentShader: auraFragmentShader,
    side: THREE.BackSide,
    transparent:true
});


    starMeshes.push(new THREE.Mesh(starGeometry, starMaterial));
    const auraMesh = new THREE.Mesh(starAuraGeometry,starAuraMaterial);
    starMeshes[i].add(auraMesh);
    starMeshes[i].position.x = (Math.random() * browserWidth) + browserLeftEdge; // Don't want overlap
    starMeshes[i].position.y = (Math.random() * browserHeight) + browserLeftEdge;
    starMeshes[i].userData.startY = starMeshes[i].position.y;
    starMeshes[i].userData.boundingBox = new THREE.Box3().setFromObject(starMeshes[i]);
    scene.add(starMeshes[i]);

}, undefined, function (err) {
    console.error("texture not loaded", err);
});
}
}

// 4. Initialize the WebGL Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setClearColor(0x111111, 1.0); // Dark grey background
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setViewport(0,0,window.innerWidth,window.innerHeight);
renderer.setScissor(0,0,window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);
renderer.domElement.addEventListener("click", function() {
    renderer.domElement.requestPointerLock();
});
renderer.render(scene, camera);

function renderViews() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    const viewSize = 250;
    const margin = 20;

    renderer.setScissorTest(true);

    //Main camera
    renderer.setViewport(0, 0, width, height);
    renderer.setScissor(0, 0, width, height);
    renderer.render(scene, camera);

    //Secondary camera
    const x = width - viewSize - margin;
    const y = height - viewSize - margin;

    renderer.setViewport(x, y, viewSize, viewSize);
    renderer.setScissor(x, y, viewSize, viewSize);
    renderer.render(scene, rearViewCamera);

    renderer.setScissorTest(false);
}

function animateAsteroids() {
    
        for(let i = 0; i < asteroidMeshes.length; i++){
            const timeSinceStart = clock.getElapsedTime();
            if(asteroidMeshes[i]){
        asteroidMeshes[i].rotation.x += 0.01;
        asteroidMeshes[i].rotation.y += 0.01;
       asteroidMeshes[i].position.x += 0.05;

asteroidMeshes[i].position.y = asteroidMeshes[i].userData.startY + Math.sin(timeSinceStart * waveSpeed + asteroidMeshes[i].position.x * waveFrequency) * waveAmplitude;

        if(asteroidMeshes[i].position.x >= browserRightEdge + 5){
            asteroidMeshes[i].position.x = browserLeftEdge - 5;
            asteroidMeshes[i].position.y = (Math.random() * browserHeight) -10;
        }
        if (asteroidMeshes[i].userData.boundingBox) {
            asteroidMeshes[i].userData.boundingBox.setFromObject(asteroidMeshes[i]);
            if (asteroidMeshes[i].userData.boundingBox.intersectsBox(shipBox)) {
                screenShake();
            }
        }
    }
        }
    requestAnimationFrame(animateAsteroids);
}

const newCube = new Float32Array([
        5, 5, 5, //Top point one (bottom left on top side)
        5, 5, -5, //Top point two (top left on top side)
        -5, 5, 5, //Top point three (bottom right on top side)
        -5, 5, -5,//Top point four (top right on top side)
        5, -5, -5,//Bottom point one (top left on bottom side)
        5, -5, 5,//Bottom point two (bottom left on bottom side)
        -5, -5, 5,//Bottom point three (bottom right on bottom side)
        -5, -5, -5 //Bottom point four (top right on bottom side)
        ]);

        const indices = [
            // Top face
            0, 1, 2,   2, 1, 3,
            // Bottom face
            4, 5, 7,   7, 5, 6,
            // Front face
            5, 0, 6,   6, 0, 2,
            // Back face
            1, 4, 3,   3, 4, 7,
            // Right face (Positive X)
            0, 5, 1,   1, 5, 4,
            // Left face (Negative X)
            6, 2, 7,   7, 2, 3
        ];

        const cubeGeometry = new THREE.BufferGeometry();
        cubeGeometry.setIndex(indices);
        cubeGeometry.setAttribute('position', new THREE.BufferAttribute(newCube, 3));

        const cubeMaterial = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            wireframe: false,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.1
        });

        

        const cubeMesh = new THREE.Mesh(cubeGeometry, cubeMaterial);
        cubeMesh.position.set(0,0,299); //Move to camera
        cubeMesh.scale.set(4,4,4); //Scale by 4. How big is the ship
        cubeMesh.position.set(0,0,300);// Move back to camera
        scene.add(cubeMesh);

        const collisionWindowAnimation = new THREE.AnimationMixer(cubeMesh);
        const collisionCameraAnimation = new THREE.AnimationMixer(camera);

        function handleShipCollision(hitBoxA, hitBoxB){
            const originalCubeY = cubeMesh.position.y;
            const originalCameraY = camera.position.y;

            if (hitBoxA.intersectsBox(hitBoxB)){
                console.log("Collision Detected");

            const collsionDurations = [0,0.1,0.3,0.4];
            const windowCollisionMovements = [originalCubeY, originalCubeY + 100, originalCubeY - 100, originalCubeY];
            const cameraCollisionMovements = [originalCameraY, originalCameraY + 100, originalCameraY - 100, originalCameraY];

            const windowCollisionTrack = new THREE.NumberKeyframeTrack('.position[y]', collsionDurations, windowCollisionMovements);
            const cameraCollisionTrack = new THREE.NumberKeyframeTrack('.position[y]', collsionDurations, cameraCollisionMovements);

            const windowCollisionClip = new THREE.AnimationClip('CollisionDetected', 0.4, [windowCollisionTrack]);
            const cameraCollisionClip = new THREE.AnimationClip('CollisionDetected', 0.4, [cameraCollisionTrack]);

            const asteroidWindowCollision = collisionWindowAnimation.clipAction(windowCollisionClip);
            const asteroidCameraCollision = collisionCameraAnimation.clipAction(cameraCollisionClip);
            
            if(!asteroidWindowCollision.isRunning() && !asteroidCameraCollision.isRunning()){
                console.log("starting shake");
            asteroidWindowCollision.reset(); //Don't want 2 copies running
            asteroidCameraCollision.reset(); //Don't want 2 copies running

            asteroidWindowCollision.setLoop(THREE.LoopOnce, 1);
            asteroidCameraCollision.setLoop(THREE.LoopOnce, 1);

            asteroidWindowCollision.clampWhenFinished = true;
            asteroidCameraCollision.clampWhenFinished = true;

            asteroidWindowCollision.play();
            asteroidCameraCollision.play();
            }
            return true;
            }
            return false;
        }

function animateStars() {
    const baseScale = 1.0;
    const growShrinkVariance = 0.25;
        for(let i = 0; i < starMeshes.length; i++){
            const timeSinceStart = clock.getElapsedTime();
            if(starMeshes[i]){
                const starMovementAlgo = Math.sin(timeSinceStart * waveSpeed + starMeshes[i].position.x * waveFrequency ) * waveAmplitude; //Controls the movement of the stars
                const currSinVal = Math.sin(timeSinceStart * waveSpeed + starMeshes[i].position.x * waveFrequency );
                const currCosineVal = Math.cos(timeSinceStart * waveSpeed + starMeshes[i].position.x * waveFrequency );

        starMeshes[i].rotation.x += 0.01;
        starMeshes[i].rotation.y += 0.01;
       starMeshes[i].position.x += 0.05;

starMeshes[i].position.y = starMeshes[i].userData.startY + Math.sin(timeSinceStart * waveSpeed + starMeshes[i].position.x * waveFrequency) * waveAmplitude;
        
    if(i % 2 == 0){
        starMeshes[i].scale.set(baseScale + (currSinVal * growShrinkVariance),baseScale + (currSinVal * growShrinkVariance),baseScale + (currSinVal * growShrinkVariance));
    }else{
        starMeshes[i].scale.set(baseScale + (currCosineVal * growShrinkVariance),baseScale + (currCosineVal * growShrinkVariance),baseScale + (currCosineVal * growShrinkVariance));
    }

        if(starMeshes[i].position.x >= browserRightEdge + 5){
            starMeshes[i].position.x = browserLeftEdge - 5;
            starMeshes[i].position.y = (Math.random() * browserHeight) -10;
        }
        if (starMeshes[i].userData.boundingBox) {
            starMeshes[i].userData.boundingBox.setFromObject(starMeshes[i]);
            if (starMeshes[i].userData.boundingBox.intersectsBox(shipBox)) {
                screenShake();
            }
        }
    }
        }
    requestAnimationFrame(animateStars);
}

let shakeAmount = 0;
const shakeDecay = 0.9; //time screen shakes for
function screenShake() {
    shakeAmount = 2.0;
    collision.play();
}

function animateSpaceship() {
    requestAnimationFrame(animateSpaceship);
    if (!ship) return;
    camera.getWorldDirection(direction);
    if(wPressed === true) {
        if(speed < 1.0) { //maximum forward speed
            if (speedUp === true) {
                speed += 0.03;
            } else {
                speed += 0.001;
            }
        }
    }
    if(sPressed === true) {
        if(speed > -0.1) { //maximum backward speed
            speed -= 0.001;
        }
    }
    if(speed < 0.0 && sPressed === false) {
        speed += 0.01;
    }
    if(speed > 0.0 && wPressed === false) {
        speed -= 0.01;
    }
    ship.rotation.copy(camera.rotation);
    ship.rotateY(THREE.MathUtils.degToRad(-90));
    ship.position.addScaledVector(direction, speed);
    camera.position.copy(ship.position);
    if (shakeAmount > 0.01) {
        camera.position.x += (Math.random() - 0.5) * shakeAmount;
        camera.position.y += (Math.random() - 0.5) * shakeAmount;
        camera.position.z += (Math.random() - 0.5) * shakeAmount;
        shakeAmount *= shakeDecay;
    } else {
        shakeAmount = 0;
    }
    rearViewCamera.position.copy(camera.position);
    rearViewCamera.rotation.copy(camera.rotation);
    rearViewCamera.rotateY(Math.PI);
    shipBox.setFromObject(ship);
    renderViews();
}
createAsteroids();
createStars();

animateSpaceship();
animateStars();
animateAsteroids();
    </script>
</body>
</html>
