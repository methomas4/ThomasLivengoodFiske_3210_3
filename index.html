<html>
<head>
    <title>CSC3210 Galactic Glide</title>
</head>
<body>
    
  <!-- Three.js Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script type="module">

// 1. Initialize the Scene
const scene = new THREE.Scene();

// 2. Configure the Camera (Perspective Projection)
// Arguments: Field of View (deg), Aspect Ratio, Near Clipping Plane, Far Clipping Plane
const camera = new THREE.PerspectiveCamera(
  35, 
  window.innerWidth / window.innerHeight, 
  0.1, 
  1000
);
camera.position.set(0, 0, 300); // Position the camera along the +Z axis
camera.lookAt(new THREE.Vector3(0, 0, 0));
scene.add(camera);

const backgroundLoader = new THREE.TextureLoader();
const spaceTexture = backgroundLoader.load('HuGGeENt6kGyixe3hT9tnY.jpg');
spaceTexture.colorSpace = THREE.SRGBColorSpace;
scene.background = spaceTexture;

const asteroidMeshes = [];
const numOfAsteroids = 10; //controls the number of asteroids rendered

const clock = new THREE.Clock();
const waveSpeed = 0.5;
const waveFrequency = 0.1;
const waveAmplitude = 2.0;

const browserHeight = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov/2)) * camera.position.z;
const browserWidth = browserHeight * camera.aspect;
const browserLeftEdge = -browserWidth / 2;
const browserRightEdge = browserWidth /2;

function createAsteroids(){
var textureLoader = new THREE . TextureLoader () ;

for(let i = 0; i < numOfAsteroids; i++){
const asteroidGeometry = new THREE.SphereGeometry(5, 9, 9);
textureLoader.load("istockphoto-1390352280-612x612.jpg", function (texture) {
    var material = new THREE.MeshBasicMaterial({ map: texture });
    asteroidMeshes.push(new THREE.Mesh(asteroidGeometry, material));
    asteroidMeshes[i].position.x = (Math.random() * browserWidth) + browserLeftEdge; // Don't want overlap
    asteroidMeshes[i].position.y = (Math.random() * browserHeight) + browserLeftEdge;
    asteroidMeshes[i].userData.startY = asteroidMeshes[i].position.y;
    scene.add(asteroidMeshes[i]);
    animateAsteroids();
}, undefined, function (err) {
    console.error("texture not loaded", err);
});
}
}

createAsteroids();

// 4. Initialize the WebGL Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setClearColor(0x111111, 1.0); // Dark grey background
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

function animateAsteroids() {
    const baseScale = 1.0;
    const growShrinkVariance = 0.5;
        for(let i = 0; i < asteroidMeshes.length; i++){
            const timeSinceStart = clock.getElapsedTime();
            if(asteroidMeshes[i]){
                const asteroidMovementAlgo = Math.sin(timeSinceStart * waveSpeed + asteroidMeshes[i].position.x * waveFrequency ) * waveAmplitude; //Controls the movement of the asteroids
                const currSinVal = Math.sin(timeSinceStart * waveSpeed + asteroidMeshes[i].position.x * waveFrequency );
                const currCosineVal = Math.cos(timeSinceStart * waveSpeed + asteroidMeshes[i].position.x * waveFrequency );

        asteroidMeshes[i].rotation.x += 0.01;
        asteroidMeshes[i].rotation.y += 0.01;
       asteroidMeshes[i].position.x += 0.05;

asteroidMeshes[i].position.y = asteroidMeshes[i].userData.startY + Math.sin(timeSinceStart * waveSpeed + asteroidMeshes[i].position.x * waveFrequency) * waveAmplitude;
        
    if(i % 2 == 0){
        asteroidMeshes[i].scale.set(baseScale + (currSinVal * growShrinkVariance),baseScale + (currSinVal * growShrinkVariance),baseScale + (currSinVal * growShrinkVariance));
    }else{
        asteroidMeshes[i].scale.set(baseScale + (currCosineVal * growShrinkVariance),baseScale + (currCosineVal * growShrinkVariance),baseScale + (currCosineVal * growShrinkVariance));
    }

        if(asteroidMeshes[i].position.x >= browserRightEdge + 5){
            asteroidMeshes[i].position.x = browserLeftEdge - 5;
            asteroidMeshes[i].position.y = (Math.random() * browserHeight) -10;
        }
    }
        }
    
    renderer.render(scene, camera);

    requestAnimationFrame(animateAsteroids);
}
    </script>
</body>
</html>
