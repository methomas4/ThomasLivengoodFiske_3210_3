<html>
<head>
    <title>CSC3210 Galactic Glide</title>
</head>
<body>
    
  <!-- Three.js Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script type="module">

// 1. Initialize the Scene
const scene = new THREE.Scene();

// 2. Configure the Camera (Perspective Projection)
// Arguments: Field of View (deg), Aspect Ratio, Near Clipping Plane, Far Clipping Plane
const camera = new THREE.PerspectiveCamera(
  35, 
  window.innerWidth / window.innerHeight, 
  0.1, 
  1000
);
camera.position.set(0, 0, 300); 
camera.lookAt(new THREE.Vector3(0, 0, 0));
scene.add(camera);

const backgroundLoader = new THREE.TextureLoader();
const spaceTexture = backgroundLoader.load('HuGGeENt6kGyixe3hT9tnY.jpg');
spaceTexture.colorSpace = THREE.SRGBColorSpace;
scene.background = spaceTexture;

const asteroidMeshes = [];
const numOfAsteroids = 20; //controls the number of asteroids rendered

const clock = new THREE.Clock();
var driftType = 0;
var baseScale = 0;
var growShrinkVariance = 0;
var scaleSpeed = 0;
var waveSpeed = 0;
var waveFrequency = 0;
var waveAmplitude = 0;
const browserHeight = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov/2)) * camera.position.z;
const browserWidth = browserHeight * camera.aspect;
const browserLeftEdge = -browserWidth / 2;
const browserRightEdge = browserWidth /2;

function createAsteroids(){
var textureLoader = new THREE.TextureLoader();

for(let i = 0; i < numOfAsteroids; i++){
const asteroidGeometry = new THREE.SphereGeometry(5, 9, 9);
textureLoader.load("istockphoto-1390352280-612x612.jpg", function (texture) {
    var material = new THREE.MeshBasicMaterial({ map: texture });
    asteroidMeshes.push(new THREE.Mesh(asteroidGeometry, material));
    asteroidMeshes[i].position.x = (Math.random() -0.5) * 100; // Don't want overlap
    asteroidMeshes[i].position.y = (Math.random() -0.5) * 60;
    asteroidMeshes[i].position.z = (Math.random() -0.5) * 1000;

    asteroidMeshes[i].userData.startY = asteroidMeshes[i].position.y;
    asteroidMeshes[i].userData.startX = asteroidMeshes[i].position.x;
    asteroidMeshes[i].userData.startZ = asteroidMeshes[i].position.z;
    asteroidMeshes[i].userData.driftType = i % 4;
asteroidMeshes[i].userData.driftSpeed = 0.2 + Math.random() * 0.3;
asteroidMeshes[i].userData.curveAmt = Math.random() * 0.0001;

asteroidMeshes[i].userData.growShrinkVariance = 0.1 + (0.01 * Math.random());
asteroidMeshes[i].userData.baseScale = 0.5 * Math.random();
asteroidMeshes[i].userData.scaleSpeed = 2.0 + Math.random();

asteroidMeshes[i].userData.waveSpeed = 0.2 + Math.random() * 0.2;
asteroidMeshes[i].userData.waveAmplitude = 5 + Math.random() * 10;
asteroidMeshes[i].userData.waveFrequency = 0.01 + Math.random() * 0.02;
    scene.add(asteroidMeshes[i]);
}, undefined, function (err) {
    console.error("texture not loaded", err);
});
}
}

createAsteroids();

// 4. Initialize the WebGL Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setClearColor(0x111111, 1.0); // Dark grey background
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const newCube = new Float32Array([
        5, 5, 5, //Top point one (bottom left on top side)
        5, 5, -5, //Top point two (top left on top side)
        -5, 5, 5, //Top point three (bottom right on top side)
        -5, 5, -5,//Top point four (top right on top side)
        5, -5, -5,//Bottom point one (top left on bottom side)
        5, -5, 5,//Bottom point two (bottom left on bottom side)
        -5, -5, 5,//Bottom point three (bottom right on bottom side)
        -5, -5, -5 //Bottom point four (top right on bottom side)
        ]);

        const indices = [
            // Top face
            0, 1, 2,   2, 1, 3,
            // Bottom face
            4, 5, 7,   7, 5, 6,
            // Front face
            5, 0, 6,   6, 0, 2,
            // Back face
            1, 4, 3,   3, 4, 7,
            // Right face (Positive X)
            0, 5, 1,   1, 5, 4,
            // Left face (Negative X)
            6, 2, 7,   7, 2, 3
        ];

        const cubeGeometry = new THREE.BufferGeometry();
        cubeGeometry.setIndex(indices);
        cubeGeometry.setAttribute('position', new THREE.BufferAttribute(newCube, 3));

        const cubeMaterial = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            wireframe: false,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.1
        });

        

        const cubeMesh = new THREE.Mesh(cubeGeometry, cubeMaterial);
        cubeMesh.position.set(0,0,299); //Move to camera
        cubeMesh.scale.set(4,4,4); //Scale by 4. How big is the ship
        cubeMesh.position.set(0,0,300);// Move back to camera
        scene.add(cubeMesh);

        const collisionWindowAnimation = new THREE.AnimationMixer(cubeMesh);
        const collisionCameraAnimation = new THREE.AnimationMixer(camera);

        function handleShipCollision(hitBoxA, hitBoxB){
            const originalCubeY = cubeMesh.position.y;
            const originalCameraY = camera.position.y;

            if (hitBoxA.intersectsBox(hitBoxB)){
                console.log("Collision Detected");

            const collsionDurations = [0,0.1,0.3,0.4];
            const windowCollisionMovements = [originalCubeY, originalCubeY + 100, originalCubeY - 100, originalCubeY];
            const cameraCollisionMovements = [originalCameraY, originalCameraY + 100, originalCameraY - 100, originalCameraY];

            const windowCollisionTrack = new THREE.NumberKeyframeTrack('.position[y]', collsionDurations, windowCollisionMovements);
            const cameraCollisionTrack = new THREE.NumberKeyframeTrack('.position[y]', collsionDurations, cameraCollisionMovements);

            const windowCollisionClip = new THREE.AnimationClip('CollisionDetected', 0.4, [windowCollisionTrack]);
            const cameraCollisionClip = new THREE.AnimationClip('CollisionDetected', 0.4, [cameraCollisionTrack]);

            const asteroidWindowCollision = collisionWindowAnimation.clipAction(windowCollisionClip);
            const asteroidCameraCollision = collisionCameraAnimation.clipAction(cameraCollisionClip);
            
            if(!asteroidWindowCollision.isRunning() && !asteroidCameraCollision.isRunning()){
                console.log("starting shake");
            asteroidWindowCollision.reset(); //Don't want 2 copies running
            asteroidCameraCollision.reset(); //Don't want 2 copies running

            asteroidWindowCollision.setLoop(THREE.LoopOnce, 1);
            asteroidCameraCollision.setLoop(THREE.LoopOnce, 1);

            asteroidWindowCollision.clampWhenFinished = true;
            asteroidCameraCollision.clampWhenFinished = true;

            asteroidWindowCollision.play();
            asteroidCameraCollision.play();
            }
            return true;
            }
            return false;
        }

function animateAsteroids() {
    const deltaTime = clock.getDelta();
    var driftType = 0;
    var driftSpeed = 0;
    var curveAmt = 0;
    var scaleFactor = 0;
        for(let i = 0; i < asteroidMeshes.length; i++){
            const timeSinceStart = clock.getElapsedTime();
            if(asteroidMeshes[i]){
                const asteroidMovementAlgo = Math.sin(timeSinceStart * asteroidMeshes[i].userData.waveSpeed + asteroidMeshes[i].position.x * asteroidMeshes[i].userData.waveFrequency ) * asteroidMeshes[i].userData.waveAmplitude; //Controls the movement of the asteroids
                const currSinVal = Math.sin(timeSinceStart * asteroidMeshes[i].userData.scaleSpeed);
                // const currCosineVal = Math.cos(timeSinceStart * asteroidMeshes[i].userData.waveSpeed + asteroidMeshes[i].position.x * asteroidMeshes[i].userData.waveFrequency);
        
        asteroidMeshes[i].rotation.x += 0.01;
        asteroidMeshes[i].rotation.y += 0.01;
       asteroidMeshes[i].position.z += 0.5 + (3 * deltaTime);
       scaleFactor = 5 + currSinVal * asteroidMeshes[i].userData.growShrinkVariance;
       asteroidMeshes[i].scale.setScalar((asteroidMeshes[i].userData.baseScale * scaleFactor));

       const shipHitbox = new THREE.Box3().setFromObject(cubeMesh);
       const asteroidHitbox = new THREE.Box3().setFromObject(asteroidMeshes[i]);

       //Logic for if the ship is hit from the front, back, top, or bottom
        if(!asteroidMeshes[i].userData.hasCollided && handleShipCollision(shipHitbox, asteroidHitbox)){
            asteroidMeshes[i].position.x = (Math.random() -0.5) * 100; // Don't want overlap
            asteroidMeshes[i].position.y = (Math.random() -0.5) * 60;
            asteroidMeshes[i].position.z = -500;

            asteroidMeshes[i].userData.startX = asteroidMeshes[i].position.x;
            asteroidMeshes[i].userData.startY = asteroidMeshes[i].position.y;
            asteroidMeshes[i].userData.startZ = asteroidMeshes[i].position.z;
            asteroidMeshes[i].userData.hasCollided = true;
        }
       var x = asteroidMeshes[i].position.z;
        
         switch(asteroidMeshes[i].userData.driftType){
            case 0: //5 of 20 asteroids will drift according to some sinusoidal function
            asteroidMeshes[i].position.y = asteroidMeshes[i].userData.startY + Math.sin(timeSinceStart * asteroidMeshes[i].userData.waveSpeed + x * asteroidMeshes[i].userData.waveFrequency) * asteroidMeshes[i].userData.waveAmplitude;
                break;
            case 1: //5 of 20 asteroids will drift along some linear function
            asteroidMeshes[i].position.y = asteroidMeshes[i].userData.startY + (timeSinceStart * asteroidMeshes[i].userData.driftSpeed) - 100;
                break;
            case 2: //5 of 20 asteroids will drift along some parabolic function
            asteroidMeshes[i].position.y = asteroidMeshes[i].userData.startY + (asteroidMeshes[i].userData.curveAmt * x * x) - 50;
                break;
            case 3: //5 of 20 asteroids will drift along some irregular function (cubic plus logarithmic)
            asteroidMeshes[i].position.y = asteroidMeshes[i].userData.startY + (asteroidMeshes[i].userData.curveAmt * Math.pow(x, 3)) + (0.5 * Math.log(Math.abs(x))) - 200;
                break;
            default: //If any additional asteroids, they will drift along some cosinusoidal function 
            asteroidMeshes[i].position.y = asteroidMeshes[i].userData.startY + Math.cos(timeSinceStart * asteroidMeshes[i].userData.waveSpeed + x * asteroidMeshes[i].userData.waveFrequency) * asteroidMeshes[i].userData.waveAmplitude; 
         }
    // if(i % 2 == 0){
    //     asteroidMeshes[i].scale.set(asteroidMeshes[i].userData.baseScale + (currSinVal * asteroidMeshes[i].userData.growShrinkVariance),asteroidMeshes[i].userData.baseScale + (currSinVal * asteroidMeshes[i].userData.growShrinkVariance),asteroidMeshes[i].userData.baseScale + (currSinVal * asteroidMeshes[i].userData.growShrinkVariance));
    // }else{
    //     asteroidMeshes[i].scale.set(asteroidMeshes[i].userData.baseScale + (currCosineVal * asteroidMeshes[i].userData.growShrinkVariance),asteroidMeshes[i].userData.baseScale + (currCosineVal * asteroidMeshes[i].userData.growShrinkVariance),asteroidMeshes[i].userData.baseScale + (currCosineVal * asteroidMeshes[i].userData.growShrinkVariance));
    // }

        if(asteroidMeshes[i].position.z >= 600){
            asteroidMeshes[i].position.x = (Math.random() - 0.5) * 100;
            asteroidMeshes[i].position.y = (Math.random() - 0.5) * 60;
            asteroidMeshes[i].position.z = -500;

            asteroidMeshes[i].userData.startX = asteroidMeshes[i].position.x;
            asteroidMeshes[i].userData.startY = asteroidMeshes[i].position.y;
            asteroidMeshes[i].userData.startZ = asteroidMeshes[i].position.z;
            asteroidMeshes[i].userData.hasCollided = false;
        }
    }
}
    
    if (collisionWindowAnimation && collisionCameraAnimation) {
        collisionWindowAnimation.update(deltaTime);
        collisionCameraAnimation.update(deltaTime);
    }

    renderer.render(scene, camera);
    requestAnimationFrame(animateAsteroids);
}
animateAsteroids();
    </script>
</body>
</html>
